name: analytics

# คำนวณสรุปงานวิเคราะห์ใหม่ทุกวัน (เลื่อนวันที่ให้ข้อมูลล่าสุดอยู่ภายใน 7 วันก่อนวันนี้) แล้วเขียนลง Firestore
# ต้องตั้ง repository secret ชื่อ FIREBASE_SERVICE_ACCOUNT_JSON = เนื้อหาทั้งไฟล์ service account JSON
on:
  schedule:
    - cron: "0 0 * * *" # 07:00 เวลาไทย
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node scripts/build-analytics.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
